name: Actualizar stock

on:
  schedule:
    - cron: '2-59/5 * * * *'   # cada 5 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:
    inputs:
      full:
        description: 'Revisar también qué artículos tiene cada tienda'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # para mantener activo el horario (GitHub lo apaga tras 60 días sin cambios)

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Leer stock de las tiendas y subirlo
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          FULL: ${{ inputs.full && '1' || '' }}
        run: node scraper/run.mjs
      - name: Mantener activo el horario
        if: github.event_name == 'schedule' && github.run_number % 2000 == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stock.yml/enable"
