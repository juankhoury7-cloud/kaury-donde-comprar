name: Actualizar stock

# Lo dispara cada 5 minutos el reloj de Cloudflare (carpeta cron/), o a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Revisar también qué artículos tiene cada tienda'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Leer stock de las tiendas y subirlo
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kaury-donde-comprar.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          FULL: ${{ inputs.full && '1' || '' }}
        run: node scraper/run.mjs
